    id TEXT PRIMARY KEY,
    nome TEXT NOT NULL,
    tamanho TEXT NOT NULL,
    categoria TEXT NOT NULL,

);

CREATE TABLE IF NOT EXISTS movimentacoes (
    id TEXT PRIMARY KEY,
    uniforme_id TEXT NOT NULL,

    function StandaloneApp() {
      const [items, setItems] = React.useState(() => {
        try {

          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return INITIAL_UNIFORMS;
      });

      const [movements, setMovements] = React.useState(() => {
        try {
          const saved = localStorage.getItem('uniformes_mov_standalone_v1');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return INITIAL_MOVEMENTS;
      });

      const [activeTab, setActiveTab] = React.useState('inventory');
      const [searchTerm, setSearchTerm] = React.useState('');
      const [filterCriticalOnly, setFilterCriticalOnly] = React.useState(false);

      // Modals
      const [withdrawalOpen, setWithdrawalOpen] = React.useState(false);
      const [entryOpen, setEntryOpen] = React.useState(false);
      const [selectedItem, setSelectedItem] = React.useState(null);

      // Form states
      const [receiver, setReceiver] = React.useState('');
      const [dispatcher, setDispatcher] = React.useState('Almoxarife de Plantão');
      const [quantity, setQuantity] = React.useState(1);
      const [reason, setReason] = React.useState('Substituição por desgaste');
      const [docRef, setDocRef] = React.useState('');
      const [copiedSql, setCopiedSql] = React.useState(false);

      React.useEffect(() => {
        localStorage.setItem('uniformes_data_standalone_v1', JSON.stringify(items));
      }, [items]);

      React.useEffect(() => {
        localStorage.setItem('uniformes_mov_standalone_v1', JSON.stringify(movements));
      }, [movements]);

      const criticalCount = items.filter(i => i.quantity <= i.minStock).length;
      const zeroCount = items.filter(i => i.quantity === 0).length;
      const totalPieces = items.reduce((acc, i) => acc + i.quantity, 0);

      const filteredItems = items.filter(item => {
        const matches = item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        item.size.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        item.category.toLowerCase().includes(searchTerm.toLowerCase());
        const isCritical = item.quantity <= item.minStock;
        return matches && (!filterCriticalOnly || isCritical);
      });

      const handleConfirmWithdrawal = () => {
        if (!selectedItem) return;
        if (!receiver.trim()) { alert('Informe o nome do funcionário recebedor'); return; }
        if (quantity > selectedItem.quantity) { alert('Estoque insuficiente!'); return; }

        const now = new Date().toISOString();
        const newMov = {
          id: 'saida-' + Date.now(),
          itemId: selectedItem.id,
          itemName: selectedItem.name,
          itemSize: selectedItem.size,
          category: selectedItem.category,
          type: 'SAIDA',
          quantity: quantity,
          employeeReceiver: receiver.trim(),
          employeeDispatcher: dispatcher.trim(),
          timestamp: now,
          reason: reason,
          documentRef: docRef,
          previousStock: selectedItem.quantity,
          newStock: selectedItem.quantity - quantity
        };

        setItems(prev => prev.map(i => i.id === selectedItem.id ? {...i, quantity: i.quantity - quantity} : i));
        setMovements(prev => [newMov, ...prev]);
        setWithdrawalOpen(false);
        setReceiver('');
        alert('Retirada registrada com sucesso para ' + receiver);
      };

      const handleConfirmEntry = () => {
        if (!selectedItem) return;
        if (quantity <= 0) { alert('Quantidade deve ser maior que 0'); return; }

        const now = new Date().toISOString();
        const newMov = {
          id: 'entrada-' + Date.now(),
          itemId: selectedItem.id,
          itemName: selectedItem.name,
          itemSize: selectedItem.size,
          category: selectedItem.category,
          type: 'ENTRADA',

          timestamp: now,
          reason: reason || 'Compra / Reposição',
          documentRef: docRef,
          previousStock: selectedItem.quantity,
          newStock: selectedItem.quantity + quantity
        };

        setMovements(prev => [newMov, ...prev]);
        setEntryOpen(false);
        alert('Estoque reabastecido com sucesso!');

          headStyles: { fillColor: [30, 41, 59] }

        doc.save('relatorio-uniformes-' + new Date().toISOString().slice(0,10) + '.pdf');

                            <td className="py-2.5 px-3 text-slate-500">{item.category}</td>
                            <td className="py-2.5 px-3 text-center font-extrabold text-sm">{item.quantity} {item.unit}</td>
                            <td className="py-2.5 px-3 text-center text-slate-500">mín. {item.minStock} {item.unit}</td>
                            <td className="py-2.5 px-3 text-right">
                              <button
                                onClick={() => { setSelectedItem(item); setWithdrawalOpen(true); }}
                                disabled={item.quantity === 0}
                                className="bg-amber-600 disabled:opacity-30 text-white px-2 py-1 rounded text-xs mr-1 font-semibold"
                              >
                                Retirar
                              </button>
                              <button
                                onClick={() => { setSelectedItem(item); setEntryOpen(true); }}
                                className="bg-emerald-600 text-white px-2 py-1 rounded text-xs font-semibold"
                              >
                                Repor
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'movements' && (
              <div className="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden p-4 space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="font-bold text-sm">Histórico de Entradas & Saídas</h2>
                  <button onClick={handleExportPdf} className="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold">
                    Baixar Relatório em PDF
                  </button>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead className="bg-slate-100 font-bold border-b border-slate-200">
                      <tr>
                        <th className="p-2">Data/Hora</th>
                        <th className="p-2">Tipo</th>
                        <th className="p-2">Uniforme</th>
                        <th className="p-2">Qtd</th>
                        <th className="p-2">Recebido Por</th>
                        <th className="p-2">Entregador</th>
                        <th className="p-2">Motivo</th>
                        <th className="p-2">Saldo</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {movements.map(m => (
                        <tr key={m.id} className="hover:bg-slate-50">
                          <td className="p-2 whitespace-nowrap">{new Date(m.timestamp).toLocaleString('pt-BR')}</td>
                          <td className="p-2 font-bold">{m.type === 'SAIDA' ? <span className="text-red-600">SAÍDA</span> : <span className="text-emerald-600">ENTRADA</span>}</td>
                          <td className="p-2 font-semibold">{m.itemName} ({m.itemSize})</td>
                          <td className="p-2 font-extrabold">{m.type === 'SAIDA' ? '-' + m.quantity : '+' + m.quantity}</td>
                          <td className="p-2">{m.employeeReceiver}</td>
                          <td className="p-2 text-slate-500">{m.employeeDispatcher}</td>
                          <td className="p-2">{m.reason}</td>
                          <td className="p-2 font-bold">{m.newStock} un</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'sql' && (
              <div className="bg-white p-5 rounded-xl shadow-xs border border-slate-200 space-y-4">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="font-bold text-base">Script SQL para Cloudflare D1 (SQLite)</h2>
                    <p className="text-xs text-slate-500">Pronto para rodar via Wrangler CLI no Cloudflare D1</p>
                  </div>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(EMBEDDED_SQL);
                      setCopiedSql(true);
                      setTimeout(() => setCopiedSql(false), 2000);
                    }}
                    className="bg-orange-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-orange-500"
                  >
                    {copiedSql ? 'Copiado!' : 'Copiar Script SQL'}
                  </button>
                </div>
                <pre className="bg-slate-900 text-slate-200 p-4 rounded-lg font-mono text-xs overflow-x-auto max-h-[450px]">
                  {EMBEDDED_SQL}
                </pre>
              </div>
            )}
          </main>

          {/* Modal Retirada */}
          {withdrawalOpen && selectedItem && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl p-5 max-w-md w-full space-y-3">
                <h3 className="font-bold text-base text-amber-700">Registrar Retirada de Uniforme</h3>
                <p className="text-xs text-slate-600">Item: <strong>{selectedItem.name} ({selectedItem.size})</strong> - Saldo: {selectedItem.quantity} {selectedItem.unit}</p>
                <div>
                  <label className="block text-xs font-bold mb-1">Nome do Funcionário que Recebeu *</label>
                  <input type="text" value={receiver} onChange={e => setReceiver(e.target.value)} placeholder="Ex: Lucas Silva" className="w-full border p-2 text-xs rounded" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Funcionário que Entregou (Almoxarife) *</label>
                  <input type="text" value={dispatcher} onChange={e => setDispatcher(e.target.value)} className="w-full border p-2 text-xs rounded" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-bold mb-1">Quantidade *</label>
                    <input type="number" min="1" max={selectedItem.quantity} value={quantity} onChange={e => setQuantity(parseInt(e.target.value)||1)} className="w-full border p-2 text-xs rounded font-bold" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold mb-1">Motivo</label>
                    <select value={reason} onChange={e => setReason(e.target.value)} className="w-full border p-2 text-xs rounded">
                      <option value="Substituição por desgaste">Substituição por desgaste</option>
                      <option value="Admissão">Admissão de colaborador</option>
                      <option value="Dano em serviço">Dano em serviço</option>
                    </select>
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setWithdrawalOpen(false)} className="px-3 py-1.5 text-xs text-slate-600">Cancelar</button>
                  <button onClick={handleConfirmWithdrawal} className="px-4 py-1.5 bg-amber-600 text-white text-xs font-bold rounded">Confirmar Retirada</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Entrada */}
          {entryOpen && selectedItem && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl p-5 max-w-md w-full space-y-3">
                <h3 className="font-bold text-base text-emerald-700">Entrada / Reposição de Uniformes</h3>
                <p className="text-xs text-slate-600">Item: <strong>{selectedItem.name} ({selectedItem.size})</strong> - Saldo atual: {selectedItem.quantity} {selectedItem.unit}</p>
                <div>
                  <label className="block text-xs font-bold mb-1">Quantidade Comprada *</label>
                  <input type="number" min="1" value={quantity} onChange={e => setQuantity(parseInt(e.target.value)||1)} className="w-full border p-2 text-xs rounded font-bold text-emerald-700" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Fornecedor / Nota Fiscal</label>
                  <input type="text" value={receiver} onChange={e => setReceiver(e.target.value)} placeholder="Ex: Fornecedor Uniformes Ltda / NF 1049" className="w-full border p-2 text-xs rounded" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Responsável Conferência Almoxarifado *</label>
                  <input type="text" value={dispatcher} onChange={e => setDispatcher(e.target.value)} className="w-full border p-2 text-xs rounded" />
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setEntryOpen(false)} className="px-3 py-1.5 text-xs text-slate-600">Cancelar</button>
                  <button onClick={handleConfirmEntry} className="px-4 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded">Adicionar ao Estoque</button>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-white border-t p-3 text-center text-xs text-slate-400">
            Controle de Uniformes de Manutenção • Pronto para GitHub Pages e Cloudflare D1
          </footer>
        </div>
      );
    }

    ReactDOM.render(<StandaloneApp />, document.getElementById('root'));
  </script>
</body>
</html>
