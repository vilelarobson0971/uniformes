    const INITIAL_MOVEMENTS = [];

    function StandaloneApp() {
      const [items, setItems] = React.useState(() => {
        try {
          const saved = localStorage.getItem('uniformes_data_standalone_v1');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return INITIAL_UNIFORMS;
      });

      const [movements, setMovements] = React.useState(() => {
        try {
          const saved = localStorage.getItem('uniformes_mov_standalone_v1');
          if (saved) {
            const parsed = JSON.parse(saved);
            // Filtra movimentações antigas de demonstração para manter o histórico 100% limpo
            if (Array.isArray(parsed)) {
              return parsed.filter(m => !m.id || !m.id.startsWith('mov-seed-'));
            }
          }
        } catch(e) {}
        return [];
      });

      const [activeTab, setActiveTab] = React.useState('inventory');
      const [searchTerm, setSearchTerm] = React.useState('');
      const [filterCriticalOnly, setFilterCriticalOnly] = React.useState(false);

      // Modals
      const [withdrawalOpen, setWithdrawalOpen] = React.useState(false);
      const [entryOpen, setEntryOpen] = React.useState(false);
      const [selectedItem, setSelectedItem] = React.useState(null);

      // Form states
      const [receiver, setReceiver] = React.useState('');
      const [dispatcher, setDispatcher] = React.useState('Almoxarife de Plantão');
      const [quantity, setQuantity] = React.useState(1);
      const [reason, setReason] = React.useState('Substituição por desgaste');
      const [docRef, setDocRef] = React.useState('');
      const [isD1Connected, setIsD1Connected] = React.useState(false);

      React.useEffect(() => {
        async function loadCloudflareData() {
          try {
            const res = await fetch('/api/uniformes');
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                const mapped = data.map(d => ({
                  id: d.id,
                  name: d.nome || d.name,
                  size: d.tamanho || d.size,
                  category: d.categoria || d.category,
                  quantity: d.quantidade !== undefined ? d.quantidade : d.quantity,
                  minStock: d.estoque_minimo !== undefined ? d.estoque_minimo : d.minStock,
                  unit: d.unidade || d.unit || 'peça',
                  location: d.localizacao || d.location || 'Almoxarifado Central'
                }));
                setItems(mapped);
                setIsD1Connected(true);
              }
            }

            const movRes = await fetch('/api/movimentacoes');
            if (movRes.ok) {
              const dataMov = await movRes.json();
              if (Array.isArray(dataMov)) {
                const mappedMov = dataMov.map(m => ({
                  id: m.id,
                  itemId: m.uniforme_id || m.itemId,
                  itemName: m.nome_uniforme || m.itemName,
                  itemSize: m.tamanho_uniforme || m.itemSize,
                  category: m.categoria || m.category,
                  type: m.tipo || m.type,
                  quantity: m.quantidade || m.quantity,
                  employeeReceiver: m.funcionario_recebeu || m.employeeReceiver,
                  employeeDispatcher: m.funcionario_entregou || m.employeeDispatcher,
                  timestamp: m.data_hora || m.timestamp,
                  reason: m.motivo || m.reason,
                  documentRef: m.documento_ref || m.documentRef,
                  newStock: m.saldo_novo !== undefined ? m.saldo_novo : m.newStock
                })).filter(m => !m.id.startsWith('mov-seed-'));
                setMovements(mappedMov);
                setIsD1Connected(true);
              }
            }
          } catch(e) {
            console.log('Modo offline / local:', e);
          }
        }
        loadCloudflareData();
      }, []);

      React.useEffect(() => {
        localStorage.setItem('uniformes_data_standalone_v1', JSON.stringify(items));
      }, [items]);

      React.useEffect(() => {
        localStorage.setItem('uniformes_mov_standalone_v1', JSON.stringify(movements));
      }, [movements]);

      const criticalCount = items.filter(i => i.quantity < i.minStock).length;
      const zeroCount = items.filter(i => i.quantity === 0).length;
      const totalPieces = items.reduce((acc, i) => acc + i.quantity, 0);

      const filteredItems = items.filter(item => {
        const matches = item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        item.size.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        item.category.toLowerCase().includes(searchTerm.toLowerCase());
        const isCritical = item.quantity < item.minStock;
        return matches && (!filterCriticalOnly || isCritical);
      });

      const handleConfirmWithdrawal = () => {
        if (!selectedItem) return;
        if (!receiver.trim()) { alert('Informe o nome do funcionário recebedor'); return; }
        if (quantity > selectedItem.quantity) { alert('Estoque insuficiente!'); return; }

        const now = new Date().toISOString();
        const newMov = {
          id: 'saida-' + Date.now(),
          itemId: selectedItem.id,
          itemName: selectedItem.name,
          itemSize: selectedItem.size,
          category: selectedItem.category,
          type: 'SAIDA',
          quantity: quantity,
          employeeReceiver: receiver.trim(),
          employeeDispatcher: dispatcher.trim(),
          timestamp: now,
          reason: reason,
          documentRef: docRef,
          previousStock: selectedItem.quantity,
          newStock: selectedItem.quantity - quantity
        };

        setItems(prev => prev.map(i => i.id === selectedItem.id ? {...i, quantity: i.quantity - quantity} : i));
        setMovements(prev => [newMov, ...prev]);
        setWithdrawalOpen(false);
        setReceiver('');

        // Sincroniza com Cloudflare D1 em tempo real
        fetch('/api/movimentacoes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: newMov.id,
            uniforme_id: selectedItem.id,
            tipo: 'SAIDA',
            quantidade: quantity,
            funcionario_recebeu: receiver.trim(),
            funcionario_entregou: dispatcher.trim(),
            data_hora: now,
            motivo: reason,
            documento_ref: docRef
          })
        }).then(res => {
          if (res.ok) setIsD1Connected(true);
        }).catch(err => console.warn('Erro ao sincronizar com D1:', err));

        alert('Retirada registrada com sucesso para ' + receiver);
      };

      const handleConfirmEntry = () => {
        if (!selectedItem) return;
        if (quantity <= 0) { alert('Quantidade deve ser maior que 0'); return; }

        const now = new Date().toISOString();
        const newMov = {
          id: 'entrada-' + Date.now(),
          itemId: selectedItem.id,
          itemName: selectedItem.name,
          itemSize: selectedItem.size,
          category: selectedItem.category,
          type: 'ENTRADA',
          quantity: quantity,
          employeeReceiver: dispatcher.trim(),
          employeeDispatcher: receiver.trim() || 'Fornecedor',
          timestamp: now,
          reason: reason || 'Compra / Reposição',
          documentRef: docRef,
          previousStock: selectedItem.quantity,
          newStock: selectedItem.quantity + quantity
        };

        setItems(prev => prev.map(i => i.id === selectedItem.id ? {...i, quantity: i.quantity + quantity} : i));
        setMovements(prev => [newMov, ...prev]);
        setEntryOpen(false);

        // Sincroniza com Cloudflare D1 em tempo real
        fetch('/api/movimentacoes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: newMov.id,
            uniforme_id: selectedItem.id,
            tipo: 'ENTRADA',
            quantidade: quantity,
            funcionario_recebeu: dispatcher.trim(),
            funcionario_entregou: receiver.trim() || 'Fornecedor',
            data_hora: now,
            motivo: reason || 'Compra / Reposição',
            documento_ref: docRef
          })
        }).then(res => {
          if (res.ok) setIsD1Connected(true);
        }).catch(err => console.warn('Erro ao sincronizar com D1:', err));

        alert('Estoque reabastecido com sucesso!');
      };

      // 1. Exportar Inventário Geral (Modelos, tamanhos, estoque atual, mínimo e status)
      const handleExportInventoryPdf = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape' });
        doc.setFillColor(30, 41, 59);
        doc.rect(0, 0, doc.internal.pageSize.getWidth(), 22, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        doc.text('CONTROLE DE UNIFORMES DE MANUTENÇÃO - INVENTÁRIO GERAL DE ESTOQUE', 14, 14);

        const data = items.map(item => {
          const isZero = item.quantity === 0;
          const isCrit = item.quantity < item.minStock;
          const status = isZero ? 'ZERADO' : isCrit ? 'CRÍTICO' : 'OK';
          return [
            item.category,
            item.name,
            item.size,
            item.quantity + ' ' + (item.unit || 'peça'),
            'mín. ' + item.minStock + ' ' + (item.unit || 'peça'),
            status,
            item.location || 'Almoxarifado'
          ];
        });

        doc.autoTable({
          startY: 28,
          head: [['Categoria', 'Modelo do Uniforme', 'Tam.', 'Estoque Atual', 'Estoque Mínimo', 'Status', 'Localização']],
          body: data,
          theme: 'grid',
          headStyles: { fillColor: [30, 41, 59] },
          styles: { fontSize: 8 }
        });

        doc.save('inventario-geral-uniformes-' + new Date().toISOString().slice(0,10) + '.pdf');
      };

      // 2. Exportar Histórico de Movimentações (Somente saídas e entradas realizadas pelo usuário)
      const handleExportMovementsPdf = () => {
        if (movements.length === 0) {
          alert('Nenhuma movimentação realizada ainda.');
          return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape' });
        doc.setFillColor(30, 41, 59);
        doc.rect(0, 0, doc.internal.pageSize.getWidth(), 22, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        doc.text('CONTROLE DE UNIFORMES DE MANUTENÇÃO - HISTÓRICO DE MOVIMENTAÇÕES', 14, 14);

        const data = movements.map(m => [
          new Date(m.timestamp).toLocaleString('pt-BR'),
          m.itemName + ' (Tam: ' + m.itemSize + ')',
          m.type,
          m.type === 'SAIDA' ? '-' + m.quantity : '+' + m.quantity,
          m.employeeReceiver,
          m.employeeDispatcher,
          m.reason,
          m.newStock + ' un'
        ]);

        doc.autoTable({
          startY: 28,
          head: [['Data/Hora', 'Uniforme & Tamanho', 'Tipo', 'Qtd', 'Recebido Por', 'Entregue Por', 'Motivo', 'Saldo']],
          body: data,
          theme: 'grid',
          headStyles: { fillColor: [30, 41, 59] }
        });

        doc.save('historico-movimentacoes-' + new Date().toISOString().slice(0,10) + '.pdf');
      };

      // 3. Limpar histórico de movimentações
      const handleClearMovements = () => {
        if (confirm('Tem certeza que deseja zerar o histórico de movimentações?')) {
          setMovements([]);
          localStorage.removeItem('uniformes_mov_standalone_v1');
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">👕</span>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-lg font-bold">Controle de Uniformes de Manutenção</h1>
                    {isD1Connected ? (
                      <span className="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        Nuvem D1 Conectada
                      </span>
                    ) : (
                      <span className="bg-blue-500/20 text-blue-300 border border-blue-500/30 text-[10px] font-medium px-2 py-0.5 rounded-full">
                        Almoxarifado
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-slate-400">Gestão de estoque, cautela de entrega e controle de reposição</p>
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                {criticalCount > 0 && (
                  <button onClick={() => setFilterCriticalOnly(!filterCriticalOnly)} className="bg-red-600 hover:bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1 animate-pulse">
                    ⚠️ {criticalCount} Itens Críticos ({zeroCount} zerados)
                  </button>
                )}
                <button onClick={() => { setSelectedItem(items[0]); setWithdrawalOpen(true); }} className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-2 rounded-lg">
                  + Registrar Retirada
                </button>
                <button onClick={() => { setSelectedItem(items[0]); setEntryOpen(true); }} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg">
                  + Adicionar Uniformes
                </button>
              </div>
            </div>
            {/* Tabs */}
            <div className="max-w-7xl mx-auto px-4 flex space-x-4 border-t border-slate-800 text-xs font-semibold py-2">
              <button onClick={() => setActiveTab('inventory')} className={activeTab === 'inventory' ? 'text-blue-400 border-b-2 border-blue-400 pb-1' : 'text-slate-400'}>
                Estoque & Catálogo ({items.length})
              </button>
              <button onClick={() => setActiveTab('movements')} className={activeTab === 'movements' ? 'text-blue-400 border-b-2 border-blue-400 pb-1' : 'text-slate-400'}>
                Histórico ({movements.length})
              </button>
            </div>
          </header>

          {/* Body */}
          <main className="max-w-7xl w-full mx-auto px-4 py-6 flex-1">
            {activeTab === 'inventory' && (
              <div className="space-y-4">
                {/* Search and Filter */}
                <div className="bg-white p-4 rounded-xl shadow-xs border border-slate-200 flex flex-col sm:flex-row justify-between gap-3">
                  <input
                    type="text"
                    value={searchTerm}
                    onChange={e => setSearchTerm(e.target.value)}
                    placeholder="Buscar uniforme por modelo, tamanho, categoria..."
                    className="w-full sm:w-80 px-3 py-1.5 text-xs border border-slate-300 rounded-lg"
                  />
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setFilterCriticalOnly(!filterCriticalOnly)}
                      className={"px-3 py-1.5 rounded-lg text-xs font-bold border " + (filterCriticalOnly ? "bg-red-600 text-white border-red-600" : "bg-white text-slate-700 border-slate-300")}
                    >
                      {filterCriticalOnly ? "Mostrando apenas críticos" : "Filtrar Críticos"}
                    </button>
                    <button onClick={handleExportInventoryPdf} className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-500">
                      Exportar Inventário Geral (PDF)
                    </button>
                  </div>
                </div>

                {/* Table */}
                <div className="bg-white rounded-xl shadow-xs border border-slate-200 overflow-x-auto">
                  <table className="w-full text-left text-xs sm:text-sm">
                    <thead className="bg-slate-50 text-slate-600 uppercase text-[11px] font-bold border-b border-slate-200">
                      <tr>
                        <th className="py-2.5 px-3">Status</th>
                        <th className="py-2.5 px-3">Modelo</th>
                        <th className="py-2.5 px-3 text-center">Tam.</th>
                        <th className="py-2.5 px-3">Categoria</th>
                        <th className="py-2.5 px-3 text-center">Estoque Atual</th>
                        <th className="py-2.5 px-3 text-center">Mínimo</th>
                        <th className="py-2.5 px-3 text-right">Ação</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredItems.map(item => {
                        const isCritical = item.quantity < item.minStock;
                        const isZero = item.quantity === 0;
                        const rowStyle = isZero ? "bg-red-100/90 text-red-950 font-bold border-l-4 border-l-rose-700" :
                                         isCritical ? "bg-red-50 text-red-950 font-medium border-l-4 border-l-red-500" :
                                         "hover:bg-slate-50 border-l-4 border-l-transparent";
                        return (
                          <tr key={item.id} className={rowStyle}>
                            <td className="py-2.5 px-3 text-center">
                              {isZero ? "🔴 ZERADO" : isCritical ? "⚠️ CRÍTICO" : "🟢 OK"}
                            </td>
                            <td className="py-2.5 px-3 font-semibold">{item.name}</td>
                            <td className="py-2.5 px-3 text-center font-bold">{item.size}</td>
                            <td className="py-2.5 px-3 text-slate-500">{item.category}</td>
                            <td className="py-2.5 px-3 text-center font-extrabold text-sm">{item.quantity} {item.unit}</td>
                            <td className="py-2.5 px-3 text-center text-slate-500">mín. {item.minStock} {item.unit}</td>
                            <td className="py-2.5 px-3 text-right">
                              <button
                                onClick={() => { setSelectedItem(item); setWithdrawalOpen(true); }}
                                disabled={item.quantity === 0}
                                className="bg-amber-600 disabled:opacity-30 text-white px-2 py-1 rounded text-xs mr-1 font-semibold"
                              >
                                Retirar
                              </button>
                              <button
                                onClick={() => { setSelectedItem(item); setEntryOpen(true); }}
                                className="bg-emerald-600 text-white px-2 py-1 rounded text-xs font-semibold"
                              >
                                Repor
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'movements' && (
              <div className="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden p-4 space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="font-bold text-sm">Histórico de Entradas & Saídas</h2>
                  <div className="flex items-center gap-2">
                    {movements.length > 0 && (
                      <button onClick={handleClearMovements} className="bg-rose-100 hover:bg-rose-200 text-rose-700 px-3 py-1.5 rounded text-xs font-bold">
                        🗑️ Limpar Histórico
                      </button>
                    )}
                    <button onClick={handleExportMovementsPdf} className="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-blue-500">
                      Exportar Histórico (PDF)
                    </button>
                  </div>
                </div>

                {movements.length === 0 ? (
                  <div className="text-center py-12 bg-slate-50 rounded-lg border border-dashed border-slate-200 text-slate-500 text-xs">
                    <p className="font-bold text-slate-700 text-sm">Nenhuma movimentação registrada até o momento.</p>
                    <p className="mt-1 text-slate-500">As novas retiradas e reposições efetuadas no almoxarifado aparecerão aqui automaticamente.</p>
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead className="bg-slate-100 font-bold border-b border-slate-200">
                        <tr>
                          <th className="p-2">Data/Hora</th>
                          <th className="p-2">Tipo</th>
                          <th className="p-2">Uniforme</th>
                          <th className="p-2">Qtd</th>
                          <th className="p-2">Recebido Por</th>
                          <th className="p-2">Entregador</th>
                          <th className="p-2">Motivo</th>
                          <th className="p-2">Saldo</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {movements.map(m => (
                          <tr key={m.id} className="hover:bg-slate-50">
                            <td className="p-2 whitespace-nowrap">{new Date(m.timestamp).toLocaleString('pt-BR')}</td>
                            <td className="p-2 font-bold">{m.type === 'SAIDA' ? <span className="text-red-600">SAÍDA</span> : <span className="text-emerald-600">ENTRADA</span>}</td>
                            <td className="p-2 font-semibold">{m.itemName} ({m.itemSize})</td>
                            <td className="p-2 font-extrabold">{m.type === 'SAIDA' ? '-' + m.quantity : '+' + m.quantity}</td>
                            <td className="p-2">{m.employeeReceiver}</td>
                            <td className="p-2 text-slate-500">{m.employeeDispatcher}</td>
                            <td className="p-2">{m.reason}</td>
                            <td className="p-2 font-bold">{m.newStock} un</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Modal Retirada */}
          {withdrawalOpen && selectedItem && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl p-5 max-w-md w-full space-y-3">
                <h3 className="font-bold text-base text-amber-700">Registrar Retirada de Uniforme</h3>
                <p className="text-xs text-slate-600">Item: <strong>{selectedItem.name} ({selectedItem.size})</strong> - Saldo: {selectedItem.quantity} {selectedItem.unit}</p>
                <div>
                  <label className="block text-xs font-bold mb-1">Nome do Funcionário que Recebeu *</label>
                  <input type="text" value={receiver} onChange={e => setReceiver(e.target.value)} placeholder="Ex: Lucas Silva" className="w-full border p-2 text-xs rounded" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Funcionário que Entregou (Almoxarife) *</label>
                  <input type="text" value={dispatcher} onChange={e => setDispatcher(e.target.value)} className="w-full border p-2 text-xs rounded" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-bold mb-1">Quantidade *</label>
                    <input type="number" min="1" max={selectedItem.quantity} value={quantity} onChange={e => setQuantity(parseInt(e.target.value)||1)} className="w-full border p-2 text-xs rounded font-bold" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold mb-1">Motivo</label>
                    <select value={reason} onChange={e => setReason(e.target.value)} className="w-full border p-2 text-xs rounded">
                      <option value="Substituição por desgaste">Substituição por desgaste</option>
                      <option value="Admissão">Admissão de colaborador</option>
                      <option value="Dano em serviço">Dano em serviço</option>
                    </select>
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setWithdrawalOpen(false)} className="px-3 py-1.5 text-xs text-slate-600">Cancelar</button>
                  <button onClick={handleConfirmWithdrawal} className="px-4 py-1.5 bg-amber-600 text-white text-xs font-bold rounded">Confirmar Retirada</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Entrada */}
          {entryOpen && selectedItem && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl p-5 max-w-md w-full space-y-3">
                <h3 className="font-bold text-base text-emerald-700">Entrada / Reposição de Uniformes</h3>
                <p className="text-xs text-slate-600">Item: <strong>{selectedItem.name} ({selectedItem.size})</strong> - Saldo atual: {selectedItem.quantity} {selectedItem.unit}</p>
                <div>
                  <label className="block text-xs font-bold mb-1">Quantidade Comprada *</label>
                  <input type="number" min="1" value={quantity} onChange={e => setQuantity(parseInt(e.target.value)||1)} className="w-full border p-2 text-xs rounded font-bold text-emerald-700" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Fornecedor / Nota Fiscal</label>
                  <input type="text" value={receiver} onChange={e => setReceiver(e.target.value)} placeholder="Ex: Fornecedor Uniformes Ltda / NF 1049" className="w-full border p-2 text-xs rounded" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Responsável Conferência Almoxarifado *</label>
                  <input type="text" value={dispatcher} onChange={e => setDispatcher(e.target.value)} className="w-full border p-2 text-xs rounded" />
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setEntryOpen(false)} className="px-3 py-1.5 text-xs text-slate-600">Cancelar</button>
                  <button onClick={handleConfirmEntry} className="px-4 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded">Adicionar ao Estoque</button>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-white border-t p-3 text-center text-xs text-slate-400">
            Controle de Uniformes de Manutenção • Pronto para GitHub Pages e Cloudflare D1
          </footer>
        </div>
      );
    }

    ReactDOM.render(<StandaloneApp />, document.getElementById('root'));
  </script>
</body>
</html>
